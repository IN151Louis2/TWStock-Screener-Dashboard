name: Taiwan Stock Deep Value Screener

on:
  schedule:
    # 對應台灣時間 04:00, 05:00, 06:00, 07:00, 08:00
    - cron: '0 20,21,22,23,0 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  run-screener:
    runs-on: ubuntu-latest
    permissions: # 1. 直接在工作流程中強制開放寫入權限 (解決 403 Error)
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Run Screener Script
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python screener.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 2. 檢查檔案是否存在，存在才 add，避免 index.html 缺失導致 add 失敗
          [ -f state.json ] && git add state.json
          [ -f results.json ] && git add results.json
          [ -f index.html ] && git add index.html
          
          git diff --staged --quiet || git commit -m "Auto-update: Screener progress and dashboard"
          git pull --rebase origin main || true
          git push origin main
